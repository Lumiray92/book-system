# =====================================================================
#  回归测试
#
#  对应 quiz07.md 第 6 条：使用 Actions 进行回归测试。
# =====================================================================
name: 回归测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上连续推送时，取消尚未跑完的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  #  后端：接口回归测试
  # -------------------------------------------------------------------
  backend:
    name: 后端接口回归测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root123456
      # 测试连到独立库，测试数据与开发数据互不干扰
      DB_NAME: book_db_test
      DB_CONNECTION_LIMIT: '10'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 试卷要求提交建表与测试数据脚本，这里先验证交付的脚本本身能独立跑通
      - name: 验证交付的 SQL 脚本可独立执行
        env:
          MYSQL_PWD: root123456
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3306 -u root < sql/01_schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root < sql/02_seed.sql
          echo "--- 建库结果 ---"
          mysql -h 127.0.0.1 -P 3306 -u root -N -e "
            SELECT CONCAT('book_type: ', COUNT(*)) FROM book_db.book_type
            UNION ALL
            SELECT CONCAT('book_info: ', COUNT(*)) FROM book_db.book_info"
          # 试卷要求每张表至少 5 条测试数据
          mysql -h 127.0.0.1 -P 3306 -u root -e "
            SELECT IF(COUNT(*) >= 5, 'book_type 测试数据充足', 'book_type 测试数据不足')
            FROM book_db.book_type" | tail -n 1

      - name: 运行接口回归测试
        run: npm test